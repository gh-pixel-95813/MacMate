name: E2E Tests
on:
  schedule:
    - cron: "0 18 * * *"  # 北京时间凌晨 2 点
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: brew install tauri-driver
      - name: Start selenium
        run: |
          brew install --cask selenium
          brew services start selenium-server
      - name: Wait for selenium
        run: |
          for i in {1..30}; do
            curl -s http://localhost:4444/status && break
            sleep 2
          done
      - run: pnpm test:e2e
        env:
          SELENIUM_REMOTE_URL: http://localhost:4444
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: |
            screenshots/
            e2e/reports/
