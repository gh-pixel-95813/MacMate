# MacMate 安全等级配置文档(纯文档,不被代码读取)
#
# 实际分类逻辑见 src/safety.rs 的 classify() 函数。本文件仅用于记录每档的
# 目录模式与中文说明,供维护者评审与前端文案对齐参考。
#
# 安全等级语义见 spec.md "Smart Selection 安全机制":
#   - safe    :默认勾选,可清理
#   - caution :默认不勾选,需手动展开
#   - danger  :仅展示,不提供自动清理入口,需用户逐项确认

# ─────────────────────── safe(安全可删) ───────────────────────
# 缓存、临时文件、废纸篓、Quick Look 缓存、Xcode 编译缓存等,均走 Trash 可恢复。
[safe]
patterns = [
  "Caches",        # ~/Library/Caches/*、~/Library/Application Support/<app>/Caches
  "tmp",            # $TMPDIR、/tmp、/private/var/folders/*
  "Temp",           # 各类 Temp 目录
  "Trash",          # ~/.Trash(废纸篓)
  "QuickLook",      # ~/Library/Caches/com.apple.QuickLook
  "DerivedData",    # ~/Library/Developer/Xcode/DerivedData
]
description = "缓存 / 临时文件 / 废纸篓 / Quick Look / 编译缓存,清理后无功能损失,默认勾选。"

# ─────────────────────── caution(谨慎清理) ───────────────────────
# 日志、Application Support(卸载场景)、浏览器历史、Cookies 等,可能影响应用状态。
[caution]
patterns = [
  "Logs",               # ~/Library/Logs/*、应用日志
  "Application Support", # 卸载场景下的 ~/Library/Application Support/<app>/
  "History",            # 浏览器历史(Safari/Chrome/Firefox)
  "Cookies",            # 浏览器 Cookie
]
description = "日志 / Application Support(卸载) / 浏览器历史与 Cookies,默认不勾选,需手动展开确认。"

# ─────────────────────── danger(仅展示) ───────────────────────
# Preferences plist、Saved Application State 等敏感偏好,清理可能丢失用户配置。
[danger]
patterns = [
  "Preferences",            # ~/Library/Preferences/<bundle-id>.plist
  ".plist",                 # 任意 Info.plist / 偏好 plist
  "Saved Application State", # ~/Library/Saved Application State/<bundle-id>.savedState
]
description = "Preferences / plist / Saved State,仅展示,不提供自动清理入口,需用户逐项确认。"
